services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    init: true
    command: --default-authentication-plugin=mysql_native_password
    environment:
      # Safe defaults make `docker compose up --build -d` work on a fresh clone.
      # Override these values through the environment or a local .env for shared deployments.
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dental-local-root-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dental}
      MYSQL_USER: ${MYSQL_USER:-dental}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dental-local-password}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      ML_API_KEY: ${ML_API_KEY:-dental-local-ml-key}
      CORS_ORIGINS: ${ALLOWED_ORIGINS:-}
      CHAT_MODEL_REVISION: ${CHAT_MODEL_REVISION:-9599cc64f7e7e14ddd639023f386f4623878e0d8}
    # The loopback mapping also lets a host-run `npm run dev` reach the model service.
    ports:
      - "127.0.0.1:8001:8001"
    expose:
      - "8001"
    volumes:
      - huggingface_cache:/home/appuser/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/').read()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      mysql:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      ML_SERVICE_URL: http://ml-service:8001
      ML_API_KEY: ${ML_API_KEY:-dental-local-ml-key}
      DATABASE_URL: mysql://${MYSQL_USER:-dental}:${MYSQL_PASSWORD:-dental-local-password}@mysql:3306/${MYSQL_DATABASE:-dental}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dental-local-nextauth-secret-change-for-deployment}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      PRIVATE_UPLOAD_DIR: /data/uploads
      RUN_DB_MIGRATIONS: ${RUN_DB_MIGRATIONS:-true}
      SEED_DEFAULT_ADMIN: ${SEED_DEFAULT_ADMIN:-true}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@gmai.com}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-admin}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - private_uploads:/data/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

volumes:
  mysql_data:
  private_uploads:
  huggingface_cache:
